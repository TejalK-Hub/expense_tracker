  <div class="container mt-4">
    <!-- Header Row -->
    <div class="d-flex align-items-center justify-content-center mb-3">
      <!-- <h3 class="title mb-0">Add Expense</h3> -->
      <div style="width: 40px"></div>
      <!-- spacer for center alignment -->
    </div>

    <!-- Form Card -->
    <div class="form-card">
      <form [formGroup]="expenseForm">
        <!-- GRID START -->
        <div class="row g-3">
          <!-- CATEGORY MULTI SELECT -->
          <div class="col-md-6">
            <label class="form-label">
              Categories <span class="required">*</span>
            </label>

            <div class="position-relative category-dropdown">
              <!-- INPUT -->
              <div
                class="form-control d-flex align-items-center justify-content-between cursor-pointer"
                (click)="toggleCategoryDropdown()"
              >
                <span
                  class="text-truncate"
                  *ngIf="selectedCategoryNames.length; else placeholder"
                >
                  {{ selectedCategoryNames.join(", ") }}
                </span>

                <ng-template #placeholder>
                  <span class="text-muted">Select Categories</span>
                </ng-template>

                <i class="bi bi-chevron-down small"></i>
              </div>

              <!-- DROPDOWN -->
              <div
                class="dropdown-menu show w-100 mt-1 p-2"
                *ngIf="isCategoryDropdownOpen"
                style="max-height: 240px; overflow-y: auto"
              >
                <div class="form-check mb-2" *ngFor="let c of categories">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    [id]="'cat-' + c.id"
                    [checked]="isCategorySelected(c.name)"
                    (change)="toggleCategory(c)"
                  />

                  <label class="form-check-label" [for]="'cat-' + c.id">
                    {{ c.name }}
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-------------------------------------------------------- Visit ------------------------------------------------------------>
          <div class="col-md-6">
            <label class="form-label">
              Visit <span class="required">*</span>
            </label>

            <div class="position-relative visit-dropdown">
              <!-- SEARCH INPUT -->
              <input
                type="text"
                class="form-control"
                placeholder="Search Visit..."
                [(ngModel)]="visitSearch"
                [ngModelOptions]="{ standalone: true }"
                (focus)="isVisitDropdownOpen = true"
                (input)="onVisitSearchChange()"
                autocomplete="off"
              />

              <!-- DROPDOWN -->
              <div
                class="dropdown-menu show w-100 mt-1 p-1"
                *ngIf="isVisitDropdownOpen"
                style="max-height: 220px; overflow-y: auto"
              >
                <!-- OPTIONS -->
                <div
                  class="dropdown-item"
                  *ngFor="let v of filteredVisits"
                  (click)="selectVisit(v)"
                  style="cursor: pointer"
                >
                  {{ v.visit_name }}
                </div>

                <!-- EMPTY STATE -->
                <div
                  *ngIf="filteredVisits.length === 0"
                  class="text-muted small px-2 py-1"
                >
                  No visits found
                </div>
              </div>
            </div>
          </div>

          <!----------------------------------------------------------------- Date ----------------------------------------------------->
          <div class="col-md-6">
            <label class="form-label">Date <span class="required">*</span></label>
            <input
              type="date"
              class="form-control"
              formControlName="date"
              name="date"
              [min]="startDate"
              [max]="endDate"
            />
          </div>

          <div class="col-md-6" *ngFor="let item of expenseItems">
            <label class="form-label">
              {{ item.category_name }} Amount
              <span class="required">*</span>
            </label>

            <div class="input-group">
              <span class="input-group-text">₹</span>

              <input
                type="number"
                class="form-control"
                [(ngModel)]="item.amount"
                [ngModelOptions]="{ standalone: true }"
                [placeholder]="'Enter ' + item.category_name + ' amount'"
                min="0"
                (keydown)="blockInvalidKeys($event)"
              />
            </div>
          </div>

          <!-- Receipt -->
          <div class="col-md-6">
            <label class="form-label"
              >Receipt No <span class="required">*</span></label
            >
            <input
              type="text"
              class="form-control"
              formControlName="receiptNo"
              name="receiptNo"
            />
          </div>

          <!-- Description -->
          <div class="col-md-6">
            <label class="form-label">Description</label>
            <input
              type="text"
              class="form-control"
              formControlName="description"
              name="description"
            />
          </div>

          <!-- FILE (FULL WIDTH) -->
          <div class="col-12">
            <label class="form-label">
              Upload Bills <span class="required">*</span>
            </label>

            <div
              class="file-box"
              (dragover)="onDragOver($event)"
              (dragleave)="onDragLeave($event)"
              (drop)="onDrop($event)"
              [class.drag-active]="isDragOver"
            >
              <input
                type="file"
                #fileInput
                (change)="fileOnChange($event)"
                accept="image/*"
                multiple
                class="form-control"
              />

              <div class="drag-text">
                Drag & Drop images here or click to upload
              </div>

              <span *ngIf="selectedFiles.length" class="small text-muted">
                <div *ngIf="selectedFiles.length > 1">
                  {{ selectedFiles.length }} files selected
                </div>

                <div *ngIf="selectedFiles.length === 1">
                  {{ selectedFiles.length }} file selected
                </div>
              </span>

              <!-- PREVIEW GRID -->
              <div *ngIf="filePreviews.length" class="preview-grid">
                <div
                  class="preview-item"
                  *ngFor="let img of filePreviews; let i = index"
                >
                  <img [src]="img" />

                  <div class="file-name">
                    {{ selectedFiles[i].name }}
                  </div>

                  <button
                    type="button"
                    class="remove-btn"
                    (click)="removeFile(i)"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- GRID END -->

        <!-- BUTTONS -->
        <div class="mt-4 d-flex gap-2">
          <button
            type="button"
            class="btn btn-primary w-100"
            (click)="onSubmit()"
            [disabled]="loading"
          >
            {{ loading ? "Saving..." : "Save" }}
          </button>

          <button type="button" class="btn btn-light w-100" (click)="onClear()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
